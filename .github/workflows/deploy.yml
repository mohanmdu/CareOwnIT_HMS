name: Deploy

on:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'hms-api/**'
            web:
              - 'hms-web/**'
            website:
              - 'hms-website/**'

  deploy-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        working-directory: hms-api
        # Tests are skipped here, not disabled everywhere: HmsApiApplicationTests
        # needs a live MySQL connection (it exercises the real Flyway migration
        # chain), which the ephemeral GitHub-hosted runner doesn't have. Tests
        # still run normally in local dev against the real hms_demo database.
        run: ./mvnw -B -q -DskipTests package
      - name: Upload jar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'hms-api/target/hms-api-0.0.1-SNAPSHOT.jar'
          target: '/home/deploy/incoming/'
          strip_components: 2
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: sudo /home/CareOwn_HMS/scripts/deploy-hms-api.sh /home/deploy/incoming/hms-api-0.0.1-SNAPSHOT.jar

  deploy-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - name: Install & build
        working-directory: hms-web
        run: |
          npm ci
          npm run build -- --configuration production
      - name: Package
        run: tar czf hms-ui.tar.gz -C hms-web/dist/hms-web/browser .
      - name: Upload
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'hms-ui.tar.gz'
          target: '/home/deploy/incoming/'
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            rm -rf /home/deploy/incoming/hms-ui && mkdir -p /home/deploy/incoming/hms-ui
            tar xzf /home/deploy/incoming/hms-ui.tar.gz -C /home/deploy/incoming/hms-ui
            sudo /home/CareOwn_HMS/scripts/deploy-hms-ui.sh /home/deploy/incoming/hms-ui

  deploy-website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - name: Install & build
        working-directory: hms-website
        run: |
          npm ci
          npm run build
      - name: Package
        run: tar czf hms-website.tar.gz -C hms-website/dist/hms-website .
      - name: Upload
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'hms-website.tar.gz'
          target: '/home/deploy/incoming/'
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            rm -rf /home/deploy/incoming/hms-website-dist && mkdir -p /home/deploy/incoming/hms-website-dist
            tar xzf /home/deploy/incoming/hms-website.tar.gz -C /home/deploy/incoming/hms-website-dist
            sudo /home/CareOwn_HMS/scripts/deploy-hms-website.sh /home/deploy/incoming/hms-website-dist
