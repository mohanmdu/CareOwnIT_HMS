<div class="change-password-shell">
  <section class="change-password-card">
    <div class="change-password-brand">
      <span class="change-password-brand-icon" aria-hidden="true">+</span>
      <div>
        <h1>Change Password</h1>
        <p>{{ forced ? 'You must set a new password before continuing.' : 'Update your account password.' }}</p>
      </div>
    </div>

    <form (ngSubmit)="submit()">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="change-password-field">
        <mat-label>Current Password</mat-label>
        <input
          matInput
          name="currentPassword"
          [type]="hidePasswords() ? 'password' : 'text'"
          [(ngModel)]="currentPassword"
          required
          autocomplete="current-password"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="change-password-field">
        <mat-label>New Password</mat-label>
        <input
          matInput
          name="newPassword"
          [type]="hidePasswords() ? 'password' : 'text'"
          [(ngModel)]="newPassword"
          required
          autocomplete="new-password"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="change-password-field">
        <mat-label>Confirm New Password</mat-label>
        <input
          matInput
          name="confirmPassword"
          [type]="hidePasswords() ? 'password' : 'text'"
          [(ngModel)]="confirmPassword"
          required
          autocomplete="new-password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          [attr.aria-label]="hidePasswords() ? 'Show passwords' : 'Hide passwords'"
          (click)="togglePasswordVisibility()"
        >
          <mat-icon aria-hidden="true">{{ hidePasswords() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      @if (errorMessage()) {
        <p class="change-password-error" role="alert">{{ errorMessage() }}</p>
      }

      <button mat-flat-button color="primary" type="submit" class="change-password-submit" [disabled]="submitting()">
        {{ submitting() ? 'Saving…' : 'Change Password' }}
      </button>
    </form>
  </section>
</div>
