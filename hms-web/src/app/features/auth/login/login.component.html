<div class="login-shell">
  <div class="login-composition">
  <section class="login-panel">
    <div class="login-brand">
      @if (branding()?.logoUrl) {
        <img [src]="branding()!.logoUrl" alt="" class="login-brand-logo" />
      } @else {
        <span class="login-brand-icon" aria-hidden="true">+</span>
      }
      <div>
        <p class="login-eyebrow">Hospital Management System</p>
        <h1>{{ branding()?.clinicName || 'HMS' }}</h1>
      </div>
    </div>

    <form (ngSubmit)="login()" class="login-form">
      @if (showClientCode) {
        <div class="login-field">
          <label for="clientCode">Client Code<span aria-hidden="true">*</span></label>
          <input
            id="clientCode"
            name="clientCode"
            [(ngModel)]="clientCode"
            (blur)="onClientCodeBlur()"
            required
            autocomplete="organization"
          />
        </div>
      }

      <div class="login-field">
        <label for="username">Username<span aria-hidden="true">*</span></label>
        <input id="username" name="username" [(ngModel)]="username" required autocomplete="username" />
      </div>

      <div class="login-field">
        <label for="password">Password<span aria-hidden="true">*</span></label>
        <div class="login-password-wrap">
          <input
            id="password"
            name="password"
            [type]="hidePassword() ? 'password' : 'text'"
            [(ngModel)]="password"
            required
            autocomplete="current-password"
          />
          <button
            type="button"
            class="login-password-toggle"
            [attr.aria-label]="hidePassword() ? 'Show password' : 'Hide password'"
            (click)="togglePasswordVisibility()"
          >
            <mat-icon aria-hidden="true">{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      @if (errorMessage()) {
        <p class="login-error" role="alert">{{ errorMessage() }}</p>
      }

      <button mat-flat-button color="primary" type="submit" class="login-submit" [disabled]="submitting()">
        <span>{{ submitting() ? 'Signing in…' : 'Sign in' }}</span>
        @if (!submitting()) {
          <span class="login-submit-arrow" aria-hidden="true">→</span>
        }
      </button>
    </form>
  </section>

  <aside
    class="login-art"
    [class.login-art-custom-bg]="!!loginBackgroundImage()"
    [style.backgroundImage]="loginBackgroundImage()"
    aria-hidden="true"
  ></aside>
  </div>
</div>
