<div class="login-shell">
  <section class="login-card">
    <div class="login-brand">
      <span class="login-brand-icon" aria-hidden="true">+</span>
      <div>
        <h1> HMS</h1>
        <p>Hospital Management System</p>
      </div>
    </div>

    <form (ngSubmit)="login()">
      @if (showClientCode) {
        <mat-form-field appearance="outline" class="login-field">
          <mat-label>Client Code</mat-label>
          <input matInput name="clientCode" [(ngModel)]="clientCode" required autocomplete="organization" />
        </mat-form-field>
      }

      <mat-form-field appearance="outline" class="login-field">
        <mat-label>Username</mat-label>
        <input matInput name="username" [(ngModel)]="username" required autocomplete="username" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="login-field">
        <mat-label>Password</mat-label>
        <input
          matInput
          name="password"
          [type]="hidePassword() ? 'password' : 'text'"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          [attr.aria-label]="hidePassword() ? 'Show password' : 'Hide password'"
          (click)="togglePasswordVisibility()"
        >
          <mat-icon aria-hidden="true">{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      @if (errorMessage()) {
        <p class="login-error" role="alert">{{ errorMessage() }}</p>
      }

      <button mat-flat-button color="primary" type="submit" class="login-submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </section>
</div>
