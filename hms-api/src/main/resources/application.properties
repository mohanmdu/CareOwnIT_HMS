# CI/CD pipeline verification marker: deploy-test-4
spring.application.name=hms-api

# --- Datasource (MASTER database - see com.pms.config.MasterJpaConfig) ---
# DB_URL/DB_USER/DB_PASSWORD are the same env var names this app has always
# used - only their meaning shifted, from "the one tenant DB" to "the master
# DB", now that a permanent master DB is a real concept (see the
# Database-per-Client Architecture plan). allowPublicKeyRetrieval=true is
# baked into the default now (was previously passed ad hoc per local run) -
# required by MySQL 8's caching_sha2_password auth plugin over an
# unencrypted (useSSL=false) local/internal connection.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hms_master?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

# --- Tenant datasource (INTERIM - one static tenant DB until dynamic
# per-client routing ships, see com.pms.config.TenantJpaConfig) ---
app.tenant-db.url=${TENANT_DB_URL:jdbc:mysql://localhost:3306/Navjeevan?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
app.tenant-db.username=${TENANT_DB_USER:root}
app.tenant-db.password=${TENANT_DB_PASSWORD:root}
app.tenant-db.pool-size=${TENANT_DB_POOL_SIZE:20}

# --- Tenant database secrets (AES-256-GCM root key for ClientDatabase.
# encryptedPassword - see com.pms.tenant.service.TenantSecretService and
# the plan's "Secrets decision"). MUST be overridden in production, same
# handling rigor as app.security.jwt-secret below - this default is a
# recognizable dev-only placeholder, not a real secret.
app.tenant-db.encryption-key=${TENANT_DB_ENCRYPTION_KEY:Q2FyZU93bkRldk9ubHlUZW5hbnREYktleTMyQnl0ZXM=}

# --- Tenant provisioning (see com.pms.tenant.service.TenantProvisioningService)
# - a deliberately SEPARATE, more privileged credential from app.tenant-db.*
# above: this one can CREATE DATABASE/CREATE USER, the app's normal
# query-traffic credentials never should. Used only for the rare, low-
# frequency "Super Admin onboards a new client" action - never for ordinary
# request handling. host/port is where new tenant databases get created
# (shard-ready - a future client could be provisioned onto a different
# host/port than today's default without any code change).
app.tenant-provisioning.admin-url=${TENANT_PROVISIONING_ADMIN_URL:jdbc:mysql://localhost:3306/mysql?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
app.tenant-provisioning.admin-username=${TENANT_PROVISIONING_ADMIN_USER:root}
app.tenant-provisioning.admin-password=${TENANT_PROVISIONING_ADMIN_PASSWORD:root}
app.tenant-provisioning.host=${TENANT_PROVISIONING_HOST:localhost}
app.tenant-provisioning.port=${TENANT_PROVISIONING_PORT:3306}

# --- Tenant connection-pool registry (see com.pms.tenant.service.
# TenantDataSourceRegistry) - tunable without a redeploy as tenant volume
# grows. MySQL's default max_connections=151 will not survive more than
# ~20-25 concurrently-saturated tenant pools at the default sizing below
# (maxPools x poolMaxSize can exceed it well before maxPools tenants are
# ever simultaneously active, since idle pools hold zero connections) -
# raise max_connections and/or shard tenants across multiple hosts
# (client_database.host/port already supports this) before real
# multi-tenant volume, rather than raising these values past what the
# database server(s) can actually sustain.
app.tenant-registry.max-pools=${TENANT_REGISTRY_MAX_POOLS:150}
app.tenant-registry.idle-eviction-minutes=${TENANT_REGISTRY_IDLE_EVICTION_MINUTES:30}
app.tenant-registry.pool-max-size=${TENANT_REGISTRY_POOL_MAX_SIZE:5}
app.tenant-registry.connection-timeout-ms=${TENANT_REGISTRY_CONNECTION_TIMEOUT_MS:5000}

# --- JPA / Hibernate ---
# ddl-auto is intentionally 'validate', not 'update' (see migration doc R3) - Flyway owns schema changes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Flyway (MASTER database only - see MasterJpaConfig's own doc comment.
# Tenant database migrations are now programmatic, not autoconfigured - see
# TenantFlywayRunner) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-master
spring.flyway.baseline-on-migrate=true

# --- Security (JWT - see com.pms.security) ---
# app.security.jwt-secret MUST be overridden per deployment in production
# (32+ random bytes, base64) - this default is fine only for local dev.
app.security.jwt-secret=${JWT_SECRET:c2FtcGxlLWRldi1vbmx5LWp3dC1zaWduaW5nLWtleS1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24=}
app.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:600}

# --- Multi-tenant licensing (Phase A - see com.pms.tenant.DeploymentModeProperties) ---
# single-tenant (default): every offline/on-prem install, unchanged 2-field
# login, one auto-seeded Client with every module licensed - zero config
# change needed on upgrade. multi-tenant: only the shared SaaS VPS sets this
# - 3-field client-code login, real per-client license enforcement.
app.deployment.mode=${DEPLOYMENT_MODE:single-tenant}

# --- CORS (see SecurityConfig.corsConfigurationSource) ---
# Comma-separated allowed origin patterns. Dev default allows any localhost
# port. MUST be overridden per deployment in production, e.g.
# CORS_ALLOWED_ORIGINS=https://careownitsolutions.com,https://www.careownitsolutions.com,https://admin.careownitsolutions.com,https://demo.careownitsolutions.com,https://api.careownitsolutions.com
app.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- File uploads (consultant photos) ---
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
